# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-battery'

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g set-titles on
set -g focus-events on

# vi keybindings
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Mouse
set -g mouse on

# Scrollback
set-option -g history-limit 100000

# Automatically renumber windows
set-option -g renumber-windows on

set -g @yank_selection 'primary'
set -g @yank_selection_mouse 'clipboard'

# Smart pane switching with awareness of vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?x?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Reorder windows
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# OSC 52 clipboard
set-option -s set-clipboard on

# Update Wayland display on reattach
set-option -g update-environment "WAYLAND_DISPLAY DISPLAY"

# Pane index starts at 1
set -g pane-base-index 1

# Tokyo Night theme (hand-rolled)
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#c0caf5"

# Left: session name (turns yellow on prefix)
set -g status-left-length 30
set -g status-left "#[fg=#1a1b26,bg=#{?client_prefix,#e0af68,#7aa2f7},bold] #S "

# Right: date and time
set -g status-right-length 150
set -g status-right "#[fg=#565f89]☸ #(kubectl config current-context 2>/dev/null) │ #(~/.tmux/scripts/battery.sh) #[fg=#1a1b26,bg=#7aa2f7,bold] %H:%M"

# Window tabs -- adaptive width
#
# Tab titles grow to fill the bar when few windows are open and shrink as more
# are added. Adapts to terminal width too, so they re-expand on resize.
#
#   budget = (client_width - 46) / session_windows - 6
#             |                |                     |
#             |                |                     `- " #I: " decoration
#             |                `- status-left + status-right chrome
#             `- live width, so this recomputes on resize
#
# Two tmux quirks force the shape of this, both of which fail SILENTLY:
#   1. #{=N:} requires a LITERAL N -- you cannot divide inline. Nesting a
#      computed value makes the parser give up and dump raw text into the
#      status bar. #{E:} does not help; truncation is parsed before expansion.
#      So: compute the budget, then branch to fixed widths.
#   2. #{>:} is a STRING comparison -- #{>:165,30} is FALSE ("1" < "3").
#      The numeric operator is #{e|>|:}. Both are valid tmux and they disagree.
#
# Hence the repetition: the budget expression must be restated at each branch.
# Tiers -- inactive: 50/34/22/14/9   current: 70/48/30/20/12
set -g window-status-format "#[fg=#565f89] #I:#{?#{e|>|:#{e|-|:#{e|/|:#{e|-|:#{client_width},46},#{session_windows}},6},50},#{=50:pane_title},#{?#{e|>|:#{e|-|:#{e|/|:#{e|-|:#{client_width},46},#{session_windows}},6},34},#{=34:pane_title},#{?#{e|>|:#{e|-|:#{e|/|:#{e|-|:#{client_width},46},#{session_windows}},6},22},#{=22:pane_title},#{?#{e|>|:#{e|-|:#{e|/|:#{e|-|:#{client_width},46},#{session_windows}},6},14},#{=14:pane_title},#{=9:pane_title}}}}}#{?window_zoomed_flag, [Z],} "
set -g window-status-current-format "#[fg=#c0caf5,bg=#24283b,bold] #I:#{?#{e|>|:#{e|-|:#{e|/|:#{e|-|:#{client_width},46},#{session_windows}},6},50},#{=70:pane_title},#{?#{e|>|:#{e|-|:#{e|/|:#{e|-|:#{client_width},46},#{session_windows}},6},34},#{=48:pane_title},#{?#{e|>|:#{e|-|:#{e|/|:#{e|-|:#{client_width},46},#{session_windows}},6},22},#{=30:pane_title},#{?#{e|>|:#{e|-|:#{e|/|:#{e|-|:#{client_width},46},#{session_windows}},6},14},#{=20:pane_title},#{=12:pane_title}}}}}#{?window_zoomed_flag,#[fg=#e0af68] [Z],} "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#24283b"
set -g pane-active-border-style "fg=#7aa2f7"

# Messages
set -g message-style "bg=#24283b,fg=#c0caf5"
set -g clock-mode-colour "#7aa2f7"

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
